# Declarative, read-only PD-mode catalog. Loaded by
# gpustack/server/pd_mode_catalog.py and served via GET /v2/pd-modes.
# Modes ship with GPUStack releases and are not user-editable resources.
#
# A mode is one disaggregation recipe: engine + KV connector + router. The
# user picks one from a single dropdown (`disaggregation.mode`) and nothing
# about the connection state — connector, ports, handshake variables —
# reaches the form. Adding an engine is adding an entry here, not changing
# code; a new entry only needs code when it needs a router peer style or a
# protocol that has no renderer yet, which is why unknown values fail at
# load time instead of rendering wrong.
#
# Deliberately isomorphic to cache-providers.yaml: the per-role env / args
# / files vocabulary is that file's `injection` section word for word, and
# the same {{placeholder}} rendering applies. The one addition is
# `connector`, which stays a structured descriptor because that is already
# the shape the extended-KV-cache assembler consumes.
#
# Entry names must equal PDModeEnum's values verbatim (schemas/models.py):
# the catalog is looked up by them, and `ascend-mooncake` vs
# `vllm-ascend-mooncake` has already happened once and failed as a silent
# table miss. Each entry's `backends` must likewise agree with
# PD_MODE_BACKENDS. The loader asserts both and fails start-up.
#
# Template placeholders:
#   {{worker_ip}}            the worker's routable management IP
#   {{net_device}}           the KV-plane NIC name derived for the worker
#   {{port}}                 the member's own HTTP API port
#   {{ports.<name>}}         base of a named port band
#   {{ports.<name>.count}}   width of a named port band
#   {{role}} {{group_id}} {{model_name}} {{runner_image}}
#   {{roles.<role>.<field>}} cross-role reference (Ascend needs each side's
#                            connector config to carry the other side's
#                            parallelism)
#   {{peers.<role>}}         the group's (ip, port) list for a role
#   {{peer.ip}} {{peer.port}}  the peer being rendered, inside router.peers.
#                            Deliberately not a bare {{ip}}/{{port}}: the peer
#                            scope nests inside a member's own, and a bare
#                            {{port}} there would resolve to the router's port
#                            instead of the peer's — a wrong address rather
#                            than a failure.
#   + DisaggregationSpec fields, e.g. {{kv_load_failure_policy}}
# Placeholders take no inner spaces: "{{ worker_ip }}" renders literally
# and the loader rejects it.

# Per-connector KV lease / abort windows (D31). Three facts differ per
# connector — the parameter's name, its default, and where it is
# configured — and the windows differ by 120x, so this cannot be a
# platform-wide constant. Whether an expiry is observable differs too.
# Modes reference an entry by `kv_lease: <connector>`; the loader resolves
# it, so a window is declared once no matter how many modes use it.
# Unqualified ids are vLLM `kv_connector` implementations; `sglang-*` ids
# are `--disaggregation-transfer-backend` values, whose KV lifecycle is a
# different mechanism (bootstrap timeout, not a lease). An entry no shipped
# mode references (moriio) is here on purpose: the window is on the record
# even where GPUStack cannot touch it.
kv_leases:
  - connector: nixl
    param: kv_lease_duration
    inject_to: connector_extra_config
    engine_default: 30
    gpustack_default: 60
    expired_metric: "vllm:nixl_num_kv_expired_reqs"
    description: >-
      Seconds prefill holds computed KV for a decode that has not read it
      yet. Decode renews by heartbeat every kv_lease_duration // 6 while
      the request is queued and stops renewing when it aborts, so the hold
      is bounded rather than leaked. The only window with a Prometheus
      counter.
  - connector: mooncake
    param: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
    inject_to: env
    engine_default: 480
    gpustack_default: 60
    # mooncake/stats.py exports zero Prometheus counters (NIXL exports 15),
    # so an expiry is only visible in the engine log. Left null rather than
    # guessed: the diagnostic path for this connector is log scanning.
    expired_metric: null
    description: >-
      Seconds before the connector aborts a request and releases its KV.
      The engine default is 8 minutes — 16x NIXL's — and the release is
      invisible to Prometheus, so on Ascend a disconnected request holds KV
      blocks for 8 minutes with nothing to alert on. Configured through an
      env var, not the connector config.
  - connector: moriio
    param: VLLM_MORI_READ_ABORT_REQUEST_TIMEOUT
    inject_to: none
    settable: false
    engine_default: 3600
    expired_metric: null
    description: >-
      A hardcoded constant in the connector, not an env var or a config
      field: one hour, 120x NIXL's window, and there is no way to shorten
      it. Recorded for the accounting; no shipped mode uses MoRIIO (ROCm
      only).
  - connector: sglang-mooncake
    param: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
    inject_to: env
    # The engine default is not in the measured record, so nothing is
    # injected and no platform default is claimed.
    engine_default: null
    gpustack_default: null
    expired_metric: null
    description: >-
      SGLang has no lease: prefill aborts the request and frees its tree
      cache when the bootstrap wait times out.
  - connector: sglang-nixl
    param: null
    inject_to: none
    settable: false
    expired_metric: null
    description: >-
      SGLang's nixl backend has neither a prefill-side release
      notification nor a prefill-side reclaim timeout. A request cancelled
      before decode starts the transfer strands its KV on prefill until the
      instance restarts — there is nothing to inject and nothing to
      scrape, which is the whole reason this field is declarable.

# Per-connector KV-transfer counters (X2 §3.1 / §3.2), keyed by the same
# connector id kv_leases uses — the transport decides both the lease window
# and what it exports, so a mode names it once. Every connector above must
# appear here, all-null if it exports nothing: "Mooncake has no Prometheus
# counters" is a measured fact and reads very differently from a connector
# somebody forgot to add.
#
# 🔴 read_from_role is the one field that has already caused a wrong answer
# in the lab. NIXL is pull-based — decode reads from prefill — so a
# completed transfer is counted on DECODE. On a working cross-host 1P1D,
# prefill's nixl_xfer_time_seconds_count stayed 0.0 while decode's went to
# 1.0. Read the prefill side and a perfectly healthy pair reports "no KV
# ever moved", which is precisely the alarm this metric exists to raise.
kv_transfer_metrics:
  - connector: nixl
    read_from_role: decode
    # Spelled as they appear in the exposition: xfer_time_seconds is a
    # histogram, so _count / _sum are its samples, and num_failed_transfers
    # is a counter, so the exposition suffixes it _total.
    xfer_count: "vllm:nixl_xfer_time_seconds_count"
    xfer_seconds: "vllm:nixl_xfer_time_seconds_sum"
    # No byte counter in the measured record, so the degradation check runs
    # on transfers-per-second-of-transfer-time instead of true bandwidth.
    # That is a rate in a different unit, which is exactly why it is only
    # ever compared against the same group's own baseline.
    xfer_bytes: null
    failed_transfers: "vllm:nixl_num_failed_transfers_total"
    min_expected_rate: null
  - connector: mooncake
    # vllm's mooncake/stats.py exports zero Prometheus counters where NIXL
    # exports fifteen. Nothing to scrape; the diagnostic path for this
    # connector is log scanning (X2 §3.3).
    read_from_role: decode
    xfer_count: null
    xfer_seconds: null
    xfer_bytes: null
    failed_transfers: null
  - connector: moriio
    read_from_role: decode
    xfer_count: null
    xfer_seconds: null
    xfer_bytes: null
    failed_transfers: null
  - connector: sglang-mooncake
    # SGLang's disaggregation counters were never verified here. Declaring
    # guessed names would give a numerator that reads zero because the name
    # was wrong — indistinguishable from the failure being detected — so the
    # ratio degrades visibly to "not measurable" instead.
    read_from_role: decode
    xfer_count: null
    xfer_seconds: null
    xfer_bytes: null
    failed_transfers: null
  - connector: sglang-nixl
    read_from_role: decode
    xfer_count: null
    xfer_seconds: null
    xfer_bytes: null
    failed_transfers: null

modes:
  - name: vllm-nixl
    display_name: vLLM + NIXL
    source: built_in
    description: >-
      vLLM's NixlConnector over UCX, fronted by the first-party vllm-router
      in two-hop mode. Verified on 2x RTX 4090: 1P1D and 2P2D, round-robin
      across both prefills, failure eviction and automatic re-add.
    backends: [vLLM]
    backend_versions: ">=0.20.0"
    kv_lease: nixl
    roles:
      prefill:
        ports:
          # The engine default (5600) is fixed, so two prefills on one host
          # collide by construction. count is 1 because phase one ships no
          # local data parallelism; with DP the engine offsets the port by
          # the data-parallel index, and the band's width is that replica
          # count — a connector-specific rule, not a platform formula.
          - { name: kv_side_channel, count: 1, inject_to: env }
        connector:
          kv_connector: NixlConnector
          kv_role: kv_producer
          kv_load_failure_policy: "{{kv_load_failure_policy}}"
          kv_connector_extra_config:
            kv_lease_duration: "{{kv_lease_duration}}"
        env:
          # This is a bind address, not just an advertised one, and the
          # engine defaults it to "localhost" — leave it unset and the side
          # channel listens on loopback only, which is exactly why
          # cross-host PD fails out of the box today.
          VLLM_NIXL_SIDE_CHANNEL_HOST: "{{worker_ip}}"
          VLLM_NIXL_SIDE_CHANNEL_PORT: "{{ports.kv_side_channel}}"
          # Left to itself UCX picks up docker0 / br-* / flannel.1 and
          # writes peer-unroutable addresses into the NIXL metadata, and
          # the far side fails the handshake with NIXL_ERR_BACKEND. The NIC
          # is derived per worker, never left as "all".
          UCX_NET_DEVICES: "{{net_device}}"
      decode:
        ports:
          - { name: kv_side_channel, count: 1, inject_to: env }
        connector:
          kv_connector: NixlConnector
          kv_role: kv_consumer
          kv_load_failure_policy: "{{kv_load_failure_policy}}"
        env:
          VLLM_NIXL_SIDE_CHANNEL_HOST: "{{worker_ip}}"
          VLLM_NIXL_SIDE_CHANNEL_PORT: "{{ports.kv_side_channel}}"
          UCX_NET_DEVICES: "{{net_device}}"
    router:
      protocol: two_hop
      image: "{{runner_image}}"
      ports:
        # --prometheus-port defaults to 29000 and always binds (its --help
        # claims otherwise), so a second PD group's router on the same host
        # dies in a Rust panic on the collision.
        - { name: prometheus, count: 1, inject_to: args }
      command:
        - vllm-router
        - --vllm-pd-disaggregation
        - --kv-connector
        - nixl
        - --host
        - "{{worker_ip}}"
        - --port
        - "{{port}}"
        # Same class of bug as VLLM_NIXL_SIDE_CHANNEL_HOST above, and the
        # same fix: this is a bind address, and left unset the exposition
        # listens on loopback only. Measured on a live 1P1D —
        # `curl worker_ip:40001/metrics` was refused while
        # `curl 127.0.0.1:40001/metrics` served 31 vllm_router series. The
        # PD-effectiveness ratio is computed on the server, off-host, so
        # without this its denominator is unreachable.
        - --prometheus-host
        - "{{worker_ip}}"
        - --prometheus-port
        - "{{ports.prometheus}}"
        - --prefill-policy
        - round_robin
        - --decode-policy
        - round_robin
        # Two values, and only two. Everything the router's own defaults
        # cover is left to them — the health check above all.
        #
        # The division of labour is the whole argument. The circuit breaker
        # runs on the *request* path, so it learns a worker is dead at real
        # traffic rate: two failed requests and it is open, which under load
        # is well under a second. The health check is the background sweep
        # that eventually notices a worker nobody happens to be routing to.
        # Fast failure detection is the breaker's job. Making the health
        # check fast too buys a few seconds the breaker already covers, and
        # costs far more than it looks like it should.
        #
        # 🔴 What it costs, measured, twice:
        #
        # 1. A short interval sits near the engine's HTTP keep-alive, which
        #    is uvicorn's default of 5s and which neither vLLM nor SGLang
        #    overrides. The router pools its connections to workers, so an
        #    interval in that neighbourhood means the engine can close a
        #    pooled connection in the same instant the checker reaches for
        #    it. At interval == 5 that happened on ~4.5% of ticks: the trace
        #    shows every healthy tick logging `reuse idle connection` then
        #    `pooling idle connection`, and the failing tick reusing decode's
        #    connection and never getting it back.
        # 2. That failure is indistinguishable, to the checker, from the
        #    worker being down. With one replica of a role there is nothing
        #    to fail over to, so the ejection is not failover, it is an
        #    outage — the next request got "Decode policy failed to select a
        #    worker", a 503 in the playground, from an engine that was
        #    perfectly healthy. Reproduced 1 of 2 times at 25-30 minutes idle.
        #
        # A long interval has none of this: at 60s the pooled connection is
        # reliably gone and cleanly reopened, which is the path that never
        # failed once in the trace. The hazard is the *boundary*, not the
        # slowness.
        #
        # ⚠️ The measurement that originally justified overriding the health
        # check does not survive re-reading. It recorded ">50% of requests
        # returning 500 for over a minute after killing one prefill" and
        # attributed it to `--health-check-interval-secs` defaulting to 60 —
        # but five values were changed together, with no single-variable
        # control, and the verification was 8 requests. `cb-failure-threshold`
        # defaults to 10, so with half of ~8 requests reaching the dead
        # prefill the breaker never came close to opening. The value that
        # actually mattered was very probably this one, not the interval.
        #
        # ⇒ Do not re-add health-check overrides without a single-variable
        # measurement that isolates them from the breaker.
        - --cb-failure-threshold
        - "2"
        - --retry-max-retries
        - "3"
      peers:
        style: repeated_flag
        prefill: { flag: "--prefill", value: "http://{{peer.ip}}:{{peer.port}}" }
        decode: { flag: "--decode", value: "http://{{peer.ip}}:{{peer.port}}" }
      capabilities:
        metrics: true
        models_endpoint: true
        # vllm_router_pd_prefill_requests_total / pd_decode_requests_total
        # are per-worker, which is the shape the PD-effectiveness ratio
        # needs; the engine side exports the KV-expiry counter.
        kv_expired_metric: true
      # The ratio's denominator, and the reason GPUStack counts nothing
      # itself. Per-worker: a group-wide ratio only says something is
      # wrong, this one says which decode stopped pulling. Verified to
      # carry values on a 1P1D run.
      request_metrics:
        prefill_requests: vllm_router_pd_prefill_requests_total
        decode_requests: vllm_router_pd_decode_requests_total
        # Measured: the label's value is the whole peer URL the router was
        # launched with — worker="http://192.168.50.15:40005" — not a worker
        # name or id, so a member is matched on host:port.
        worker_label: worker
        # The exposition is a separate listener from the API: it lives on
        # the band above, not on {{port}}. Scraping the API port returns
        # 404, and a 404 reads as "no denominator" — the check would stop
        # working without ever saying so.
        port_band: prometheus
        # Aggregated by route rather than by peer. Coarser, and the right
        # denominator when no member matches its label: it still answers
        # "did the router route anything at all", which is the question a
        # ratio of zero has to be read against.
        total_requests: vllm_router_pd_requests_total
      health_path: /health

  - name: sglang-mooncake
    display_name: SGLang + Mooncake
    source: built_in
    description: >-
      SGLang's own disaggregation over the Mooncake transfer backend (its
      default), fronted by the official sglang_router. Decode fetches
      prefill's parallelism from prefill's bootstrap service, so the two
      sides rendezvous themselves and the router only has to dispatch.
    backends: [SGLang]
    kv_lease: sglang-mooncake
    roles:
      prefill:
        ports:
          # The engine default (8998) is fixed, so two prefills on one host
          # collide — and it is the same number vLLM's Mooncake connector
          # uses for its bootstrap, so a mixed host collides too. The
          # router is the only consumer of this band, which is why it is
          # safe to read across roles: the router waits for its
          # dependencies, by which time the band is persisted.
          - { name: bootstrap, count: 1, inject_to: args }
        args:
          - --disaggregation-mode
          - prefill
          - --disaggregation-bootstrap-port
          - "{{ports.bootstrap}}"
          - --disaggregation-transfer-backend
          - mooncake
      decode:
        args:
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - mooncake
    router:
      protocol: same_dispatch
      image: "{{runner_image}}"
      command:
        - python3
        - -m
        - sglang_router.launch_router
        - --pd-disaggregation
        - --host
        - "{{worker_ip}}"
        - --port
        - "{{port}}"
        # The same two values as the vLLM recipe, and for the same reason.
        # `vllm-project/router` is a fork of this gateway, so its defaults
        # are this one's verbatim — `cb_failure_threshold = 10`,
        # `retry_max_retries = 5`, `health_check_interval_secs = 60`. A
        # breaker that needs ten failures to open is ten users' requests
        # spent learning what two would have taught it, and that is as true
        # here as there. See the vllm-nixl recipe for why the health check
        # is deliberately left alone.
        - --cb-failure-threshold
        - "2"
        - --retry-max-retries
        - "3"
      peers:
        style: repeated_flag
        # A prefill peer is "URL BOOTSTRAP_PORT": the second positional
        # value is the named band above.
        # `peer.ports.` and not `ports.`: in the deployment scope that name
        # means the *router's* band, and for a two-prefill group there is no
        # single right answer there at all — each prefill was allocated its own.
        prefill: { flag: "--prefill", value: "http://{{peer.ip}}:{{peer.port}} {{peer.ports.bootstrap}}" }
        decode: { flag: "--decode", value: "http://{{peer.ip}}:{{peer.port}}" }
      capabilities:
        metrics: true
        models_endpoint: true
        # SGLang's Mooncake path exports no KV-expiry counter.
        kv_expired_metric: false
      # No request_metrics: vllm-router is a fork of this gateway and the
      # counter names should be the same shape, but "should" was never
      # measured on this side. An unverified name yields a denominator that
      # reads zero for the wrong reason, so the ratio is reported as not
      # measurable until someone runs it.
      health_path: /health

  - name: sglang-nixl
    display_name: SGLang + NIXL
    source: built_in
    description: >-
      SGLang's disaggregation over the NIXL transfer backend, fronted by the
      same official sglang_router. Unlike vLLM's NixlConnector this path has
      no prefill-side reclaim timeout, so a request cancelled between the
      two sides strands its KV until the instance restarts.
    backends: [SGLang]
    kv_lease: sglang-nixl
    roles:
      prefill:
        ports:
          - { name: bootstrap, count: 1, inject_to: args }
        args:
          - --disaggregation-mode
          - prefill
          - --disaggregation-bootstrap-port
          - "{{ports.bootstrap}}"
          - --disaggregation-transfer-backend
          - nixl
        env:
          # SGLang selects the NIXL plugin by env; UCX is the one the
          # runner images carry.
          SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
          # Same UCX library, same failure as the vLLM NIXL path: left to
          # itself it advertises peer-unroutable virtual-bridge addresses.
          # Inherited from that path rather than measured here.
          UCX_NET_DEVICES: "{{net_device}}"
      decode:
        args:
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - nixl
        env:
          SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
          UCX_NET_DEVICES: "{{net_device}}"
    router:
      protocol: same_dispatch
      image: "{{runner_image}}"
      command:
        - python3
        - -m
        - sglang_router.launch_router
        - --pd-disaggregation
        - --host
        - "{{worker_ip}}"
        - --port
        - "{{port}}"
        # The same two values as the vLLM recipe, and for the same reason.
        # `vllm-project/router` is a fork of this gateway, so its defaults
        # are this one's verbatim — `cb_failure_threshold = 10`,
        # `retry_max_retries = 5`, `health_check_interval_secs = 60`. A
        # breaker that needs ten failures to open is ten users' requests
        # spent learning what two would have taught it, and that is as true
        # here as there. See the vllm-nixl recipe for why the health check
        # is deliberately left alone.
        - --cb-failure-threshold
        - "2"
        - --retry-max-retries
        - "3"
      peers:
        style: repeated_flag
        # `peer.ports.` and not `ports.`: in the deployment scope that name
        # means the *router's* band, and for a two-prefill group there is no
        # single right answer there at all — each prefill was allocated its own.
        prefill: { flag: "--prefill", value: "http://{{peer.ip}}:{{peer.port}} {{peer.ports.bootstrap}}" }
        decode: { flag: "--decode", value: "http://{{peer.ip}}:{{peer.port}}" }
      capabilities:
        metrics: true
        models_endpoint: true
        kv_expired_metric: false
      health_path: /health

  - name: vllm-ascend-mooncake
    display_name: vLLM-Ascend + Mooncake
    source: built_in
    description: >-
      vLLM-Ascend's MooncakeHybridConnector with the transfer engine on the
      Ascend protocol, fronted by vllm-ascend's own proxy example. Reverse
      engineered from a running cross-host 1P1D on 910B2 x8 x2
      (vllm-ascend v0.23.0 / vLLM 0.23.0). Every one of the four
      declarations below differs from the NIXL path, which is why they are
      declarations and not code.
    backends: [vLLM]
    # CANN plus the Ascend docker runtime.
    runtime: ascend
    kv_lease: mooncake
    roles:
      prefill:
        ports:
          # kv_port is a base address and the connector binds one port per
          # tensor-parallel rank: TP8 was measured holding 41100-41107.
          # The width is the connector's rule, so it is declared here
          # instead of derived from data parallelism in code. It has no
          # engine default at all and must be given explicitly.
          - { name: kv_port, count: "{{tensor_parallel_size}}", inject_to: args }
        connector:
          kv_connector: MooncakeHybridConnector
          kv_role: kv_producer
          # The port lives inside the connector config, so allocation and
          # connector assembly have to happen at the same moment — the
          # "--kv-transfer-config carries no addresses" property holds for
          # NIXL only.
          kv_port: "{{ports.kv_port}}"
          kv_connector_extra_config:
            # Both sides carry both sides' parallelism: prefill's config
            # names decode's TP and vice versa. Measured as
            # {"prefill":{"dp_size":1,"tp_size":8},"decode":{...}} on both
            # instances. This coupling has no NIXL equivalent and is the
            # reason templates support cross-role references.
            prefill:
              tp_size: "{{roles.prefill.tensor_parallel_size}}"
              dp_size: "{{roles.prefill.data_parallel_size}}"
            decode:
              tp_size: "{{roles.decode.tensor_parallel_size}}"
              dp_size: "{{roles.decode.data_parallel_size}}"
        env:
          # All control plane. The data plane needs nothing from us: CANN
          # uses the per-card RoCE ports directly, and measurement put
          # 99.94% of the bytes there, invisible to the host stack.
          HCCL_IF_IP: "{{worker_ip}}"
          # The worker's NIC, not a per-card one. The card-internal
          # eth0-eth7 names do not exist in the host netns, and the
          # per-card RoCE addresses are unroutable from the host TCP stack,
          # so a handshake address can only ever be the management IP.
          HCCL_SOCKET_IFNAME: "{{net_device}}"
          GLOO_SOCKET_IFNAME: "{{net_device}}"
          TP_SOCKET_IFNAME: "{{net_device}}"
      decode:
        ports:
          - { name: kv_port, count: "{{tensor_parallel_size}}", inject_to: args }
        connector:
          kv_connector: MooncakeHybridConnector
          kv_role: kv_consumer
          kv_port: "{{ports.kv_port}}"
          kv_connector_extra_config:
            prefill:
              tp_size: "{{roles.prefill.tensor_parallel_size}}"
              dp_size: "{{roles.prefill.data_parallel_size}}"
            decode:
              tp_size: "{{roles.decode.tensor_parallel_size}}"
              dp_size: "{{roles.decode.data_parallel_size}}"
        env:
          HCCL_IF_IP: "{{worker_ip}}"
          HCCL_SOCKET_IFNAME: "{{net_device}}"
          GLOO_SOCKET_IFNAME: "{{net_device}}"
          TP_SOCKET_IFNAME: "{{net_device}}"
    router:
      protocol: two_hop
      image: "{{runner_image}}"
      command:
        - python
        - /vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py
        - --host
        - "{{worker_ip}}"
        - --port
        - "{{port}}"
      peers:
        # Hosts and ports arrive as two parallel flags.
        style: parallel_lists
        prefill: { host_flag: "--prefiller-hosts", port_flag: "--prefiller-ports" }
        decode: { host_flag: "--decoder-hosts", port_flag: "--decoder-ports" }
      capabilities:
        # Measured: no /metrics, and not even /v1/models — polling them
        # filled the router log with 404s roughly once a second and
        # reported a permanent false failure. Declaring the absence is what
        # stops that.
        metrics: false
        models_endpoint: false
        kv_expired_metric: false
      # No health endpoint either, so readiness is process liveness only.
      health_path: null

  - name: custom
    display_name: Custom
    source: built_in
    description: >-
      GPUStack injects no connection state at all: connector, ports,
      handshake variables and the router's image and command are the user's
      to write on the roles. Also the only way to mix engines across roles,
      since every other recipe expands into one engine's connector config.
    # Empty means unconstrained, matching PD_MODE_BACKENDS: with nothing
    # injected, any engine mix is the user's own to get right.
    backends: []
    roles: {}
    router:
      protocol: user_provided
    kv_lease: null
