    default_enabled: false

  # Table category: Multilingualism
  # Supported in current lm-eval task inventory:
  # - MMMLU -> mmmlu
  # - MMLU-ProX -> mmlu_prox_en (representative single-language variant only)
  # - Global PIQA -> global_piqa_prompted
  # Missing from current lm-eval task inventory:
  # - NOVA-63
  # - INCLUDE
  # - PolyMATH
  # - WMT24++
  # - MAXIFE
  - id: multilingualism
    name: Multilingualism
    description: >
      Multilingual suite built from benchmark families with confirmed lm-eval
      support. Includes MMMLU, a representative MMLU-ProX variant, and Global PIQA.
    category: multilingual
    tasks:
      - mmmlu
      - mmlu_prox_en
      - global_piqa_prompted
    estimated_runtime_level: medium
    recommended_for:
      - multilingual capability checks
      - cross-lingual regression tracking
      - localization readiness comparison
    default_enabled: true

  # Table category: Coding Agent
  # Missing from current lm-eval task inventory:
  # - SWE-bench Verified
  # - SWE-bench Multilingual
  # - SecCodeBench
  # - Terminal Bench 2
  - id: coding-agent
    name: Coding Agent
    description: >
      Coding agent suite placeholder. The benchmark families from this category
      are not currently confirmed in the local lm-eval task inventory.
    category: coding_agent
    tasks: []
    estimated_runtime_level: long
    recommended_for:
