# -----------------------------
# GPUSStack Full Metrics Definition
# All metrics include full hierarchy labels
# -----------------------------
gpustack_metrics:
  gpustack:num_requests_running:
    type: Gauge
    description: "Number of requests currently being processed."

  gpustack:num_requests_waiting:
    type: Gauge
    description: "Number of requests waiting in the queue."

  gpustack:num_requests_swapped:
    type: Gauge
    description: "Number of requests swapped out to CPU."

  gpustack:prefix_cache_hit_rate:
    type: Gauge
    description: "Prefix cache hit rate"

  gpustack:kv_cache_usage_ratio:
    type: Gauge
    description: "KV-cache usage ratio. 1.0 means fully used (100%)."

  gpustack:prefix_cache_queries:
    type: Counter
    description: "Number of prefix cache queries, measured by the total queried tokens."

  gpustack:prefix_cache_hits:
    type: Counter
    description: "Number of prefix cache hits, measured by the total hit tokens."

  gpustack:external_prefix_cache_queries:
    type: Counter
    description: "Number of external KV cache (shared cache service) queries, measured by the total queried tokens."

  gpustack:external_prefix_cache_hits:
    type: Counter
    description: "Number of external KV cache (shared cache service) hits, measured by the total hit tokens."

  gpustack:prompt_tokens:
    type: Counter
    description: "Total number of prefill tokens processed."

  gpustack:generation_tokens:
    type: Counter
    description: "Total number of generated tokens."

  gpustack:request_prompt_tokens:
    type: Histogram
    description: "Number of prefill tokens processed."

  gpustack:request_generation_tokens:
    type: Histogram
    description: "Number of generation tokens processed."

  gpustack:prompt_tokens_cached:
    type: Counter
    description: "Total number of prompt tokens served from cache."

  gpustack:time_to_first_token_seconds:
    type: Histogram
    description: "Time to generate first token."

  gpustack:time_per_output_token_seconds:
    type: Histogram
    description: "Average time spent to produce each output token."

  gpustack:e2e_request_latency_seconds:
    type: Histogram
    description: "End-to-end request latency."

  gpustack:request_queue_time_seconds:
    type: Histogram
    description: "Time spent waiting in the request queue."

  gpustack:request_inference_time_seconds:
    type: Histogram
    description: "Time spent in the running/inference phase."

  gpustack:request_prefill_time_seconds:
    type: Histogram
    description: "Time spent in the prefill phase."

  gpustack:request_decode_time_seconds:
    type: Histogram
    description: "Time spent in the decode phase."

  gpustack:request_prefill_kv_computed_tokens:
    type: Histogram
    description: "Number of new KV tokens computed during prefill, excluding cache hits."

  gpustack:request_params_n:
    type: Histogram
    description: "Requested number of parallel completions per request."

  gpustack:request_params_max_tokens:
    type: Histogram
    description: "Requested max_tokens value per request."

  gpustack:request_success:
    type: Counter
    description: "Total number of successful requests."

  gpustack:request_preemptions:
    type: Counter
    description: "Cumulative number of preemptions from the engine."

  gpustack:inter_token_latency_seconds:
    type: Histogram
    description: "Time to generate the next token after the previous token has been produced."

  gpustack:spec_decode_accept_rate:
    type: Gauge
    description: "Average speculative decoding acceptance rate."

  gpustack:spec_decode_accepted_tokens:
    type: Counter
    description: "Total number of accepted speculative draft tokens."

  gpustack:spec_decode_draft_tokens:
    type: Counter
    description: "Total number of speculative draft tokens."


# -----------------------------
# Runtime Metrics Mapping (user-configurable)
# -----------------------------
  # --- Prefill/decode disaggregation -------------------------------------
  # Read on the role the connector's semantics name: NIXL has decode PULL, so
  # decode counts; SGLang has prefill PUSH, so prefill counts. A healthy pair
  # therefore reports zero on the other side, and reading the wrong one turns
  # a working group into a silent-degradation alarm.
  gpustack:pd_kv_transfer_bytes:
    type: Histogram
    unit: bytes
    description: "KV bytes transferred between prefill and decode. Its _count is the number of transfers."

  gpustack:pd_kv_transfer_seconds:
    type: Histogram
    unit: seconds
    description: "Time spent transferring KV between prefill and decode. Divided into the bytes above this is throughput while transferring, not throughput per wall second."

  gpustack:pd_kv_transfer_failed:
    type: Counter
    description: "Failed KV transfers reported by the engine."

  gpustack:pd_kv_lease_expired:
    type: Counter
    description: "Requests whose KV lease expired unread: their prefill was computed and thrown away. Tracked on the PREFILL instance."

  gpustack:pd_router_prefill_requests:
    type: Counter
    description: "Requests the router dispatched to a prefill worker. Per worker, so a low ratio points at one member rather than at the group."

  gpustack:pd_router_decode_requests:
    type: Counter
    description: "Requests the router dispatched to a decode worker."

  gpustack:pd_router_decode_errors:
    type: Counter
    description: "Decode dispatches the router saw fail, per worker. Counted before the router's own retry, so a non-zero value against a window where every request returned 200 is the share of traffic a retry covered up -- the only place that is visible."

  gpustack:pd_prompt_tokens_by_source:
    type: Counter
    description: "Prompt tokens split by where they came from, on the `source` label: `local_compute` (this engine prefilled them), `local_cache_hit` (its own prefix cache), `external_kv_transfer` (they arrived from a KV connector). vLLM guarantees the three sum to the prompt total, which is what makes the external share a ratio rather than a count."

  gpustack:pd_router_requests:
    type: Counter
    description: "Requests the router handled, aggregated by route. The coarse denominator, used when no per-worker counter exists."


runtime_mapping:
  vLLM:
    "*": # 0.21.0
      vllm:num_requests_running: gpustack:num_requests_running
      vllm:num_requests_waiting: gpustack:num_requests_waiting
      vllm:prefix_cache_hits: gpustack:prefix_cache_hits
      vllm:prefix_cache_queries: gpustack:prefix_cache_queries
      # Reported by the KV connector when the instance attaches to a
      # shared cache service; absent otherwise.
      vllm:external_prefix_cache_hits: gpustack:external_prefix_cache_hits
      vllm:external_prefix_cache_queries: gpustack:external_prefix_cache_queries
      vllm:kv_cache_usage_perc: gpustack:kv_cache_usage_ratio
      vllm:prompt_tokens: gpustack:prompt_tokens
      vllm:prompt_tokens_cached: gpustack:prompt_tokens_cached
      vllm:generation_tokens: gpustack:generation_tokens
      vllm:time_to_first_token_seconds: gpustack:time_to_first_token_seconds
      vllm:request_time_per_output_token_seconds: gpustack:time_per_output_token_seconds
      vllm:e2e_request_latency_seconds: gpustack:e2e_request_latency_seconds
      vllm:request_queue_time_seconds: gpustack:request_queue_time_seconds
      vllm:request_inference_time_seconds: gpustack:request_inference_time_seconds
      vllm:request_prefill_time_seconds: gpustack:request_prefill_time_seconds
      vllm:request_decode_time_seconds: gpustack:request_decode_time_seconds
      vllm:request_prefill_kv_computed_tokens: gpustack:request_prefill_kv_computed_tokens
      vllm:request_params_n: gpustack:request_params_n
      vllm:request_params_max_tokens: gpustack:request_params_max_tokens
      vllm:request_success: gpustack:request_success
      vllm:num_preemptions: gpustack:request_preemptions
      vllm:request_prompt_tokens: gpustack:request_prompt_tokens
      vllm:request_generation_tokens: gpustack:request_generation_tokens
      vllm:inter_token_latency_seconds: gpustack:inter_token_latency_seconds
      vllm:spec_decode_num_accepted_tokens: gpustack:spec_decode_accepted_tokens
      # PD: already in base units, so a plain rename.
      vllm:nixl_bytes_transferred: gpustack:pd_kv_transfer_bytes
      vllm:nixl_xfer_time_seconds: gpustack:pd_kv_transfer_seconds
      vllm:nixl_num_failed_transfers: gpustack:pd_kv_transfer_failed
      vllm:nixl_num_kv_expired_reqs: gpustack:pd_kv_lease_expired
      # The router's own counters. It is a model instance like any other; its
      # exposition just lives on a separate port band (see `_metrics_port`).
      vllm_router_pd_prefill_requests: gpustack:pd_router_prefill_requests
      vllm_router_pd_decode_requests: gpustack:pd_router_decode_requests
      vllm_router_pd_requests: gpustack:pd_router_requests
      # ⚠️ The `worker` label these three and the errors counter carry is the
      # UPSTREAM ENGINE URL (`http://ip:port`), not a GPUStack worker -- the
      # host is separately on `worker_name`, added by the aggregator. Grouping
      # a per-member chart on the wrong one collapses every member of a host
      # into one series, which on a single-host xPyD is all of them.
      vllm_router_pd_decode_errors: gpustack:pd_router_decode_errors
      # ⛔ Deliberately NOT mapped: `vllm_router_active_workers`. Measured
      # 2026-09-07 on a 1P1D that was serving traffic -- it read 0. The router
      # does not maintain the gauge, so surfacing it would show "no members"
      # on a healthy group, and an unmapped name is the honest way to say a
      # counter cannot be trusted.
      vllm:spec_decode_num_draft_tokens: gpustack:spec_decode_draft_tokens
      # PD effectiveness, per token rather than per transfer. The engine
      # itself says how much of each prompt it did NOT compute, so this needs
      # no connector counter and no router denominator -- see the
      # `external_token_share` query below.
      vllm:prompt_tokens_by_source: gpustack:pd_prompt_tokens_by_source
    "<0.11.1":
      vllm:num_requests_swapped: gpustack:num_requests_swapped
    "<0.11.0":
      vllm:time_per_output_token_seconds: gpustack:time_per_output_token_seconds
    "<0.9.2":
       vllm:gpu_prefix_cache_hits: gpustack:prefix_cache_hits
       vllm:gpu_prefix_cache_queries: gpustack:prefix_cache_queries
       vllm:gpu_cache_usage_perc: gpustack:kv_cache_usage_ratio

  SGLang:
    "*": # 0.5.15.post1
      # PD: NOT in base units. SGLang reports duration in MILLISECONDS where
      # vLLM reports seconds, so `scale` is not optional -- two units under one
      # name is worse than two names, because a reader can no longer tell which
      # they have.
      #
      # 🔴 Renamed upstream between 0.5.12 and 0.5.15. The old names are kept in
      # the `<0.5.13` range below rather than deleted: a mapping that points at
      # a series the engine no longer exports resolves to nothing, the ratio
      # gets no numerator, and the endpoint reports `unmeasurable` -- which
      # reads exactly like "this connector exports no counters". Measured
      # 2026-09-01 on 0.5.15.post1: `kv_transfer_total_mb` and
      # `kv_transfer_latency_ms` are both absent, and PD effectiveness had been
      # silently unmeasurable on every SGLang group since the upgrade.
      #
      # `bootstrap` is the transfer, not the handshake before it: its `_count`
      # tracks requests 1:1 (measured -- 5 requests moved both roles' counters
      # by exactly 5), which is what makes it the numerator.
      sglang:kv_transfer_bootstrap_ms:
        name: gpustack:pd_kv_transfer_seconds
        scale: 0.001
      # ⚠️ No bytes counter on 0.5.15. `kv_transfer_total_mb` is gone and
      # nothing replaced it, so `gpustack:pd_kv_transfer_bytes` is simply
      # absent here -- bandwidth is unavailable for SGLang, and saying so by
      # omission is better than mapping a name that resolves to nothing.
      # This gateway exports no per-worker dispatch counter, only the route
      # aggregate. Declaring the coarse one is honest; inventing the per-worker
      # names from the shared fork ancestry is how the `smg_` vs
      # `vllm_router_` divergence would have been missed.
      smg_router_requests: gpustack:pd_router_requests
      sglang:num_running_reqs: gpustack:num_requests_running
      sglang:num_queue_reqs: gpustack:num_requests_waiting
      sglang:num_retracted_reqs: gpustack:request_preemptions
      sglang:cache_hit_rate: gpustack:prefix_cache_hit_rate
      sglang:token_usage: gpustack:kv_cache_usage_ratio
      sglang:prompt_tokens: gpustack:prompt_tokens
      sglang:generation_tokens: gpustack:generation_tokens
      sglang:time_to_first_token_seconds: gpustack:time_to_first_token_seconds
      sglang:e2e_request_latency_seconds: gpustack:e2e_request_latency_seconds
      sglang:queue_time_seconds: gpustack:request_queue_time_seconds
      sglang:inter_token_latency_seconds: gpustack:inter_token_latency_seconds
      sglang:spec_accept_rate: gpustack:spec_decode_accept_rate
    "<0.5.13":
      # The pre-rename PD names, measured on 0.5.12.post1: total_mb_sum=189.0
      # and latency_ms_sum=214.15 over the same 83 transfers.
      sglang:kv_transfer_total_mb:
        name: gpustack:pd_kv_transfer_bytes
        scale: 1048576
      sglang:kv_transfer_latency_ms:
        name: gpustack:pd_kv_transfer_seconds
        scale: 0.001
      sglang:num_retracted_requests: gpustack:request_preemptions
      sglang:cached_tokens: gpustack:prompt_tokens_cached
    "<=0.4.4":
      sglang:time_per_output_token_seconds: gpustack:time_per_output_token_seconds
      
  MindIE:
    "*": # 2.3.0
      num_requests_running: gpustack:num_requests_running
      num_requests_waiting: gpustack:num_requests_waiting
      num_requests_swapped: gpustack:num_requests_swapped
      npu_prefix_cache_hit_rate: gpustack:prefix_cache_hit_rate
      npu_cache_usage_perc: gpustack:kv_cache_usage_ratio
      prompt_tokens: gpustack:prompt_tokens
      generation_tokens: gpustack:generation_tokens
      time_to_first_token_seconds: gpustack:time_to_first_token_seconds
      time_per_output_token_seconds: gpustack:time_per_output_token_seconds
      e2e_request_latency_seconds: gpustack:e2e_request_latency_seconds
      request_success: gpustack:request_success
      num_preemptions: gpustack:request_preemptions
      request_prompt_tokens: gpustack:request_prompt_tokens
      request_generation_tokens: gpustack:request_generation_tokens

# -----------------------------
# Declared PromQL (gpustack/schemas/metric_queries.py)
#
# The expressions a feature runs, kept beside the names they read so a renamed
# counter and the query over it are edited in one place. Scope is per operand:
# `counted_role` is the role whose transfer counter is authoritative for the
# connector (decode where it pulls, prefill where it pushes) and the caller
# resolves it from the catalog; `group` is everything under the model.
#
# Version ranges resolve like `runtime_mapping` above — a matching range wins
# key by key over `"*"`. Only `"*"` is populated: the axis is here because our
# own unified names can change, and during a rolling upgrade two workers
# publish two vintages of them, where an expression written for the newer one
# returns empty against the older and empty reads as "nothing happened".
# -----------------------------
metric_queries:
  pd:
    "*":
      # 🔑 The strongest effectiveness signal, where the engine reports it.
      #
      # vLLM splits every prompt token by origin and guarantees
      # `local_compute + local_cache_hit + external_kv_transfer = total`, so
      # the external share IS the ratio -- no connector counter, no router
      # denominator, and both operands come from the same engine.
      #
      # Measured 2026-09-01 on three deployments: Ascend/Mooncake 0.20.2,
      # x86/NIXL 0.27.1, and the same x86 group with the router bypassed. In
      # the first two decode read `external=total, local_compute=0`; in the
      # third the 32 tokens decode had to recompute landed in `local_compute`
      # and the ratio fell. That third case is the silent degradation this
      # whole endpoint exists to catch, and it is the first signal that
      # catches it without a router counter to compare against.
      #
      # ⚠️ `receiving_role`, not `counted_role`: a token that came over the
      # wire is counted where it ARRIVED, which is decode whether the
      # connector pulls or pushes. The two scopes agree on NIXL and would part
      # on a pushing connector, where `counted_role` is prefill -- and reading
      # this counter on prefill would tally the sender's own prompt tokens and
      # call it evidence of transfer.
      external_tokens:
        counter_increase:
          metric: gpustack:pd_prompt_tokens_by_source_total
          scope: receiving_role
          labels:
            source: external_kv_transfer
      # 🔴 The denominator is external + this, NOT the prompt total. The third
      # source, `local_cache_hit`, is decode's own prefix cache doing its job:
      # those tokens were never going to cross, so counting them as a shortfall
      # blames the connector for a cache hit. Measured 2026-09-02 on a healthy
      # 1P1D, three requests sharing a prefix: decode read local_compute=0,
      # local_cache_hit=64.1, external=152.8 -- external/total = 0.70, which the
      # partial-degradation band would have called degraded on a group where
      # nothing was recomputed at all.
      #
      # Against this denominator the ratio is exactly what the verdict claims:
      # of the tokens decode could not get from its own cache, the share that
      # arrived over the wire instead of being computed a second time. Healthy
      # is 1.0 by construction, which is what makes a fixed band meaningful.
      recomputed_tokens:
        counter_increase:
          metric: gpustack:pd_prompt_tokens_by_source_total
          scope: receiving_role
          labels:
            source: local_compute
      # 🔑 The same question as `recomputed_tokens`, asked per REQUEST instead
      # of per token -- and the pair is not redundant, they have opposite
      # blind spots.
      #
      # `external_token_share` sums every token in the window, so a minority
      # of requests recomputing whole prompts is diluted by the majority that
      # did not: 5% of requests recomputing, in a window with mixed prompt
      # lengths, can leave the ratio at 0.97 and sit inside `effective`. This
      # histogram's p99 jumps to those requests' prompt length instead.
      #
      # ⚠️ `receiving_role`, for the same reason the token counters use it: on
      # PREFILL this histogram is the work prefill is *supposed* to do, and it
      # spans the whole prompt on a healthy group. Measured 2026-09-07 on a
      # working 1P1D -- decode had all 36 requests in the `le=1.0` bucket
      # while prefill's spread from `le=10` to `+Inf`. Read on prefill it
      # would alarm on every correctly working deployment.
      #
      # 🔴 A healthy reading is BELOW 1.0, not 0: the first bucket is `le=1.0`
      # and `histogram_quantile` interpolates inside whichever bucket it lands
      # in, so a group that recomputed nothing reports `quantile * 1.0`
      # (0.95 / 0.99 -- measured). The signal is the jump to hundreds, since
      # the next bucket edges are 2, 5, 10.
      recomputed_tokens_p95:
        histogram_quantile:
          quantile: 0.95
          metric: gpustack:request_prefill_kv_computed_tokens
          scope: receiving_role
      recomputed_tokens_p99:
        histogram_quantile:
          quantile: 0.99
          metric: gpustack:request_prefill_kv_computed_tokens
          scope: receiving_role
      # --- Per member, from the router ----------------------------------
      # The only counters that know how the router actually spread the
      # traffic. Grouped on `worker` (the upstream engine URL) rather than
      # `worker_name` (the host) -- see the mapping note above.
      #
      # 🔑 Why this is worth its own group rather than folding into the
      # verdict: the verdict answers "is the group disaggregating", and these
      # answer "is one member carrying or missing the traffic", which is the
      # question an xPyD ratio change is actually about. A group can read
      # `effective` with one decode taking nothing.
      member_prefill_requests:
        counter_increase:
          metric: gpustack:pd_router_prefill_requests_total
          scope: group
        group_by: [worker]
      member_decode_requests:
        counter_increase:
          metric: gpustack:pd_router_decode_requests_total
          scope: group
        group_by: [worker]
      # Non-zero here while every request returned 200 means the router's
      # retry covered a failure up. That is the signal, so it is reported per
      # member rather than summed: a retry that always lands on the same bad
      # decode is invisible in a total.
      member_decode_errors:
        counter_increase:
          metric: gpustack:pd_router_decode_errors_total
          scope: group
        group_by: [worker]
      # `_count` of the seconds histogram IS the transfer count, so the
      # numerator needs no separate counter. Read from the SECONDS family and
      # not the bytes one: SGLang 0.5.15 dropped its bytes histogram, and the
      # duration histogram is the only one both engines still export.
      transfers:
        counter_increase:
          metric: gpustack:pd_kv_transfer_seconds_count
          scope: counted_role
      bytes:
        counter_increase:
          metric: gpustack:pd_kv_transfer_bytes_sum
          scope: counted_role
      seconds:
        counter_increase:
          metric: gpustack:pd_kv_transfer_seconds_sum
          scope: counted_role
      failed:
        counter_increase:
          metric: gpustack:pd_kv_transfer_failed_total
          scope: group
      # Scoped to the group, not to a role: vLLM tracks the lease counter on
      # PREFILL while the transfer counters are on decode, so summing the
      # group is right either way and encodes no guess about which side.
      expired:
        counter_increase:
          metric: gpustack:pd_kv_lease_expired_total
          scope: group
      # The good denominator: per-worker, so a low ratio points at one decode
      # rather than at "the group".
      requests_per_worker:
        counter_increase:
          metric: gpustack:pd_router_decode_requests_total
          scope: group
      # The fallback, for a router that exports no per-worker counter. Coarser,
      # and still the right answer to "did anything get routed at all", which
      # is the question a ratio of zero is meaningless without.
      requests_total:
        counter_increase:
          metric: gpustack:pd_router_requests_total
          scope: group
      # --- Transport health -------------------------------------------
      # Percentiles, not just the mean. A degrading path shows up in the tail
      # first, and a mean over a window is guaranteed to hide it: llm-d's own
      # PD dashboard charts p50/p95/p99 of exactly this histogram.
      kv_transfer_seconds_p50:
        histogram_quantile:
          quantile: 0.5
          metric: gpustack:pd_kv_transfer_seconds
          scope: counted_role
      kv_transfer_seconds_p95:
        histogram_quantile:
          quantile: 0.95
          metric: gpustack:pd_kv_transfer_seconds
          scope: counted_role
      kv_transfer_seconds_p99:
        histogram_quantile:
          quantile: 0.99
          metric: gpustack:pd_kv_transfer_seconds
          scope: counted_role
      # Mean bytes per transfer. Worth its own figure because a drop here
      # precedes a slowdown: smaller chunks mean more per-transfer overhead
      # for the same volume.
      kv_transfer_bytes_avg:
        ratio_increase:
          numerator:   { metric: gpustack:pd_kv_transfer_bytes_sum,   scope: counted_role }
          denominator: { metric: gpustack:pd_kv_transfer_bytes_count, scope: counted_role }

      # --- Balance, per role --------------------------------------------
      # 🔑 The only objective signal for whether the P:D ratio is right, and
      # which way it is wrong. A gauge, so it is averaged over the window
      # rather than increased — `increase()` on a queue depth is meaningless.
      # The newest sample, not the window's mean: queue depth describes *now*.
      # Averaged over fifteen minutes, a backlog that formed a minute ago is
      # divided by fifteen and reads as calm, and one that cleared ten minutes
      # ago keeps being reported until the window rolls past it -- wrong in
      # both directions, and in the direction that matters wrong when it
      # matters most.
      pending_requests:
        gauge_last:
          metric: gpustack:num_requests_waiting
        group_by: [role]
      running_requests:
        gauge_avg:
          metric: gpustack:num_requests_running
        group_by: [role]

      # --- Prefill work actually done, per role -------------------------
      # 🔑 Grouped by role, and that is not a presentation choice: a request
      # increments `prompt_tokens` on BOTH roles (measured -- one 16-token
      # request adds 16 on prefill and 16 on decode), so a group-wide sum
      # doubles it. The failure is silent, because twice the real figure still
      # looks like a plausible token rate.
      #
      # The pair exists to be subtracted. Prefill's compute-bound premise holds
      # only for tokens it actually computed, so the tokens served from cache
      # have to come off before the figure means anything: ByteDance's
      # HeteroScale rejected raw prefill TPS as a scaling signal for exactly
      # this reason and kept only "KV cache missed prefill TPS".
      #
      # Subtracted in Python rather than declared as PromQL arithmetic, for two
      # reasons: a `-` between two instant vectors drops every series that does
      # not match on both sides, so one absent counter would empty the result
      # instead of reporting a gap; and the two operands are worth reporting on
      # their own -- their ratio is the cache hit share.
      #
      # `_total` is the exposed name: the Prometheus client appends it to a
      # counter at exposition, while `metric_families` above declares the
      # registered name without it.
      prompt_tokens:
        counter_increase:
          metric: gpustack:prompt_tokens_total
        group_by: [role]
      cached_prompt_tokens:
        counter_increase:
          metric: gpustack:prompt_tokens_cached_total
        group_by: [role]

      # --- Latency, per role --------------------------------------------
      # 🔑 The reason PD is worth running at all: prefill owns TTFT and decode
      # owns TPOT. A figure averaged across both roles describes neither, so
      # these are grouped by role rather than summed.
      #
      # 📌 llm-d splits these by matching pod NAMES (`pod=~".*prefill.*"`).
      # We have a real `role` label from the aggregator, which does not break
      # when instance naming changes and works for engines whose role is not
      # in the pod name.
      time_to_first_token_seconds:
        ratio_increase:
          numerator:   { metric: gpustack:time_to_first_token_seconds_sum }
          denominator: { metric: gpustack:time_to_first_token_seconds_count }
        group_by: [role]
      time_per_output_token_seconds:
        ratio_increase:
          numerator:   { metric: gpustack:time_per_output_token_seconds_sum }
          denominator: { metric: gpustack:time_per_output_token_seconds_count }
        group_by: [role]
      # Throughput WHILE TRANSFERRING: bytes over time spent moving them, not
      # over wall clock. A window that was mostly idle would otherwise read as
      # a collapse in throughput.
      rate_series:
        ratio_increase:
          numerator:
            metric: gpustack:pd_kv_transfer_bytes_sum
            scope: counted_role
          denominator:
            metric: gpustack:pd_kv_transfer_seconds_sum
            scope: counted_role
      # 🔑 The mixed-scope case the per-operand design exists for: transfers
      # counted on one role, requests counted across the group.
      ratio_series:
        ratio_increase:
          numerator:
            metric: gpustack:pd_kv_transfer_bytes_count
            scope: counted_role
          denominator:
            metric: gpustack:pd_router_requests_total
            scope: group
