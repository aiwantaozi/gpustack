# Declarative, read-only PD-mode catalog. Loaded by
# gpustack/server/pd_mode_catalog.py and served via GET /v2/pd-modes.
# Modes ship with GPUStack releases and are not user-editable resources.
#
# A mode is one disaggregation recipe: engine + KV connector + router. The
# user picks one from a single dropdown (`disaggregation.mode`) and nothing
# about the connection state — connector, ports, handshake variables —
# reaches the form. Adding an engine is adding an entry here, not changing
# code; a new entry only needs code when it needs a router peer style or a
# protocol that has no renderer yet, which is why unknown values fail at
# load time instead of rendering wrong.
#
# Deliberately isomorphic to cache-providers.yaml: the per-role env / args
# / files vocabulary is that file's `injection` section word for word, and
# the same {{placeholder}} rendering applies. The one addition is
# `connector`, which stays a structured descriptor because that is already
# the shape the extended-KV-cache assembler consumes.
#
# Entry names must equal PDModeEnum's values verbatim (schemas/models.py):
# the catalog is looked up by them, and `ascend-mooncake` vs
# `vllm-ascend-mooncake` has already happened once and failed as a silent
# table miss. Each entry's `backends` must likewise agree with
# PD_MODE_BACKENDS. The loader asserts both and fails start-up.
#
# Template placeholders:
#   {{worker_ip}}            the worker's routable management IP
#   {{net_device}}           the KV-plane NIC name derived for the worker
#   {{port}}                 the member's own HTTP API port
#   {{ports.<name>}}         base of a named port band
#   {{ports.<name>.count}}   width of a named port band
#   {{role}} {{group_id}} {{model_name}} {{runner_image}}
#   {{roles.<role>.<field>}} cross-role reference (Ascend needs each side's
#                            connector config to carry the other side's
#                            parallelism)
#   {{peers.<role>}}         the group's (ip, port) list for a role
#   {{peer.ip}} {{peer.port}}  the peer being rendered, inside router.peers.
#                            Deliberately not a bare {{ip}}/{{port}}: the peer
#                            scope nests inside a member's own, and a bare
#                            {{port}} there would resolve to the router's port
#                            instead of the peer's — a wrong address rather
#                            than a failure.
#   + DisaggregationSpec fields, e.g. {{kv_load_failure_policy}}
# Placeholders take no inner spaces: "{{ worker_ip }}" renders literally
# and the loader rejects it.

# Per-connector KV lease / abort windows (D31). Three facts differ per
# connector — the parameter's name, its default, and where it is
# configured — and the windows differ by 120x, so this cannot be a
# platform-wide constant. Whether an expiry is observable differs too.
# Modes reference an entry by `kv_lease: <connector>`; the loader resolves
# it, so a window is declared once no matter how many modes use it.
# Unqualified ids are vLLM `kv_connector` implementations; `sglang-*` ids
# are `--disaggregation-transfer-backend` values, whose KV lifecycle is a
# different mechanism (bootstrap timeout, not a lease). An entry no shipped
# mode references (moriio) is here on purpose: the window is on the record
# even where GPUStack cannot touch it.
kv_leases:
  - connector: nixl
    param: kv_lease_duration
    inject_to: connector_extra_config
    engine_default: 30
    gpustack_default: 60
    expired_metric: "vllm:nixl_num_kv_expired_reqs"
    description: >-
      Seconds prefill holds computed KV for a decode that has not read it
      yet. Decode renews by heartbeat every kv_lease_duration // 6 while
      the request is queued and stops renewing when it aborts, so the hold
      is bounded rather than leaked. The only window with a Prometheus
      counter.
  - connector: mooncake
    param: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
    inject_to: env
    engine_default: 480
    gpustack_default: 60
    # mooncake/stats.py exports zero Prometheus counters (NIXL exports 15),
    # so an expiry is only visible in the engine log. Left null rather than
    # guessed: the diagnostic path for this connector is log scanning.
    expired_metric: null
    description: >-
      Seconds before the connector aborts a request and releases its KV.
      The engine default is 8 minutes — 16x NIXL's — and the release is
      invisible to Prometheus, so on Ascend a disconnected request holds KV
      blocks for 8 minutes with nothing to alert on. Configured through an
      env var, not the connector config.
  - connector: moriio
    param: VLLM_MORI_READ_ABORT_REQUEST_TIMEOUT
    inject_to: none
    settable: false
    engine_default: 3600
    expired_metric: null
    description: >-
      A hardcoded constant in the connector, not an env var or a config
      field: one hour, 120x NIXL's window, and there is no way to shorten
      it. Recorded for the accounting; no shipped mode uses MoRIIO (ROCm
      only).
  - connector: sglang-mooncake
    param: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
    inject_to: env
    # The engine default is not in the measured record, so nothing is
    # injected and no platform default is claimed.
    engine_default: null
    gpustack_default: null
    expired_metric: null
    description: >-
      SGLang has no lease: prefill aborts the request and frees its tree
      cache when the bootstrap wait times out.
  - connector: sglang-nixl
    param: null
    inject_to: none
    settable: false
    expired_metric: null
    description: >-
      SGLang's nixl backend has neither a prefill-side release
      notification nor a prefill-side reclaim timeout. A request cancelled
      before decode starts the transfer strands its KV on prefill until the
      instance restarts — there is nothing to inject and nothing to
      scrape, which is the whole reason this field is declarable.

# Per-connector KV-transfer counters (X2 §3.1 / §3.2), keyed by the same
# connector id kv_leases uses — the transport decides both the lease window
# and what it exports, so a mode names it once. Every connector above must
# appear here, all-null if it exports nothing: "Mooncake has no Prometheus
# counters" is a measured fact and reads very differently from a connector
# somebody forgot to add.
#
# 🔴 read_from_role is the one field that has already caused a wrong answer
# in the lab. NIXL is pull-based — decode reads from prefill — so a
# completed transfer is counted on DECODE. On a working cross-host 1P1D,
# prefill's nixl_xfer_time_seconds_count stayed 0.0 while decode's went to
# 1.0. Read the prefill side and a perfectly healthy pair reports "no KV
# ever moved", which is precisely the alarm this metric exists to raise.
# Which side of a pair owns the KV transfer counters, and whether it has any.
#
# 🔴 The metric NAMES were here until 2026-08-28 and are now in
# `metrics_config.yaml`, where the worker's aggregator normalizes every
# engine's spelling AND its units onto one set of `gpustack:pd_*` names.
# Two copies meant two files per rename, and after the move nothing read this
# one -- a declaration that looked authoritative and changed nothing.
#
# What is left is semantics, which normalization cannot absorb.
kv_transfer_metrics:
  # NIXL PULLS: decode reads from prefill, so decode counts. Measured on a
  # working 1P1D -- prefill's transfer count stayed at 0.0 for the whole run.
  - connector: nixl
    read_from_role: decode

  # 🔴 vLLM's mooncake/stats.py exports ZERO Prometheus counters where NIXL
  # exports fifteen. So PD effectiveness is not decidable from metrics on this
  # connector at all, and the diagnostic path is log scanning (X2 3.6).
  # Declaring that beats a ratio that reads zero because the counter was never
  # there -- which is indistinguishable from the failure it should catch.
  - connector: mooncake
    read_from_role: decode
    observable: false

  - connector: moriio
    read_from_role: decode
    observable: false

  # 🔴 SGLang PUSHES, so PREFILL counts -- the opposite of NIXL, and not a
  # slip. The router same-dispatches to both roles, decode allocates its
  # receive slots and registers them through prefill's bootstrap service, and
  # prefill then writes into them. The metric families say it harder than the
  # docs do: `kv_transfer_total_mb`, `kv_transfer_speed_gb_s` and
  # `kv_transfer_latency_ms` exist ONLY on prefill, because the sender is the
  # side that knows how many bytes went and how fast. Decode gets only
  # `kv_transfer_bootstrap_ms` and `kv_transfer_alloc_ms` -- handshake and
  # buffer allocation, which is all a receiver does here.
  #
  # ⚠️ Read the wrong side and a healthy pair reports "no KV ever moved": the
  # exact alarm this exists to raise, fired at a deployment that is fine.
  - connector: sglang-mooncake
    read_from_role: prefill

  - connector: sglang-nixl
    read_from_role: prefill

modes:
  - name: vllm-nixl
    display_name: vLLM + NIXL
    source: built_in
    description: >-
      vLLM's NixlConnector over UCX, fronted by the first-party vllm-router
      in two-hop mode. Verified on 2x RTX 4090: 1P1D and 2P2D, round-robin
      across both prefills, failure eviction and automatic re-add.
    backends: [vLLM]
    backend_versions: ">=0.20.0"
    kv_lease: nixl
    roles:
      prefill:
        ports:
          # The engine default (5600) is fixed, so two prefills on one host
          # collide by construction. count is 1 because phase one ships no
          # local data parallelism; with DP the engine offsets the port by
          # the data-parallel index, and the band's width is that replica
          # count — a connector-specific rule, not a platform formula.
          - { name: kv_side_channel, count: 1, inject_to: env }
        connector:
          kv_connector: NixlConnector
          kv_role: kv_producer
          kv_load_failure_policy: "{{kv_load_failure_policy}}"
          kv_connector_extra_config:
            kv_lease_duration: "{{kv_lease_duration}}"
        env:
          # This is a bind address, not just an advertised one, and the
          # engine defaults it to "localhost" — leave it unset and the side
          # channel listens on loopback only, which is exactly why
          # cross-host PD fails out of the box today.
          VLLM_NIXL_SIDE_CHANNEL_HOST: "{{worker_ip}}"
          VLLM_NIXL_SIDE_CHANNEL_PORT: "{{ports.kv_side_channel}}"
          # Left to itself UCX picks up docker0 / br-* / flannel.1 and
          # writes peer-unroutable addresses into the NIXL metadata, and
          # the far side fails the handshake with NIXL_ERR_BACKEND. The NIC
          # is derived per worker, never left as "all".
          UCX_NET_DEVICES: "{{net_device}}"
      decode:
        ports:
          - { name: kv_side_channel, count: 1, inject_to: env }
        connector:
          kv_connector: NixlConnector
          kv_role: kv_consumer
          kv_load_failure_policy: "{{kv_load_failure_policy}}"
        env:
          VLLM_NIXL_SIDE_CHANNEL_HOST: "{{worker_ip}}"
          VLLM_NIXL_SIDE_CHANNEL_PORT: "{{ports.kv_side_channel}}"
          UCX_NET_DEVICES: "{{net_device}}"
    router:
      protocol: two_hop
      image: "{{runner_image}}"
      ports:
        # --prometheus-port defaults to 29000 and always binds (its --help
        # claims otherwise), so a second PD group's router on the same host
        # dies in a Rust panic on the collision.
        - { name: prometheus, count: 1, inject_to: args }
      command:
        - vllm-router
        - --vllm-pd-disaggregation
        - --kv-connector
        - nixl
        - --host
        - "{{worker_ip}}"
        - --port
        - "{{port}}"
        # Same class of bug as VLLM_NIXL_SIDE_CHANNEL_HOST above, and the
        # same fix: this is a bind address, and left unset the exposition
        # listens on loopback only. Measured on a live 1P1D —
        # `curl worker_ip:40001/metrics` was refused while
        # `curl 127.0.0.1:40001/metrics` served 31 vllm_router series. The
        # PD-effectiveness ratio is computed on the server, off-host, so
        # without this its denominator is unreachable.
        - --prometheus-host
        - "{{worker_ip}}"
        - --prometheus-port
        - "{{ports.prometheus}}"
        # Asymmetric on purpose, and each side for its own reason.
        #
        # Prefill gets cache_aware because prefix reuse is the only thing a
        # prefill role can win: two requests sharing a prompt prefix want the
        # same worker, and routing them apart recomputes the shared part.
        # It is also this router's own default — the earlier round_robin here
        # was chosen on the belief that prefix-aware routing needs a tokenizer
        # in the router, and it does not. The policy's whole configuration
        # surface is router-side (cache_threshold, balance_abs_threshold,
        # balance_rel_threshold, max_tree_size, eviction_interval_secs): an
        # approximate radix tree over request text, with a load-imbalance
        # escape hatch. There is no --model-path and no tokenizer to feed.
        #
        # Decode keeps round_robin because prefix affinity buys a decode role
        # nothing — its prompt KV arrives over the connector from prefill, not
        # out of its own cache, so what matters is decode-slot load. The
        # load-aware policy for that is power_of_two, deliberately NOT used
        # yet: it reads worker load through the router's load monitor, and
        # whether a vLLM worker answers what that monitor asks for is
        # unverified. round_robin is the honest placeholder until it is.
        - --prefill-policy
        - cache_aware
        - --decode-policy
        - round_robin
        # The values below, and only those. Everything the router's own defaults
        # cover is left to them — the health check above all.
        #
        # The division of labour is the whole argument. The circuit breaker
        # runs on the *request* path, so it learns a worker is dead at real
        # traffic rate: two failed requests and it is open, which under load
        # is well under a second. The health check is the background sweep
        # that eventually notices a worker nobody happens to be routing to.
        # Fast failure detection is the breaker's job. Making the health
        # check fast too buys a few seconds the breaker already covers, and
        # costs far more than it looks like it should.
        #
        # 🔴 What it costs, measured, twice:
        #
        # 1. A short interval sits near the engine's HTTP keep-alive, which
        #    is uvicorn's default of 5s and which neither vLLM nor SGLang
        #    overrides. The router pools its connections to workers, so an
        #    interval in that neighbourhood means the engine can close a
        #    pooled connection in the same instant the checker reaches for
        #    it. At interval == 5 that happened on ~4.5% of ticks: the trace
        #    shows every healthy tick logging `reuse idle connection` then
        #    `pooling idle connection`, and the failing tick reusing decode's
        #    connection and never getting it back.
        # 2. That failure is indistinguishable, to the checker, from the
        #    worker being down. With one replica of a role there is nothing
        #    to fail over to, so the ejection is not failover, it is an
        #    outage — the next request got "Decode policy failed to select a
        #    worker", a 503 in the playground, from an engine that was
        #    perfectly healthy. Reproduced 1 of 2 times at 25-30 minutes idle.
        #
        # A long interval has none of this: at 60s the pooled connection is
        # reliably gone and cleanly reopened, which is the path that never
        # failed once in the trace. The hazard is the *boundary*, not the
        # slowness.
        #
        # ⚠️ The measurement that originally justified overriding the health
        # check does not survive re-reading. It recorded ">50% of requests
        # returning 500 for over a minute after killing one prefill" and
        # attributed it to `--health-check-interval-secs` defaulting to 60 —
        # but five values were changed together, with no single-variable
        # control, and the verification was 8 requests. `cb-failure-threshold`
        # defaults to 10, so with half of ~8 requests reaching the dead
        # prefill the breaker never came close to opening. The value that
        # actually mattered was very probably this one, not the interval.
        #
        # ⇒ Do not re-add health-check overrides without a single-variable
        # measurement that isolates them from the breaker.
        #
        # 🟢 Verified after reverting, on the same 1P1D group that produced
        # the outage. The router boots `Started health checker for workers
        # with 60s interval`, and over 124 minutes and ~124 ticks its log
        # holds nothing but the startup block and the traces of the seven
        # requests below — no warning, no error, no ejection. The first
        # request after 85 minutes idle: 200 in 0.25s. After a second,
        # deliberately uncontaminated 35-minute idle window (the request
        # counter was read before and after and had not moved): 200 in 0.12s.
        # That is 0 for 2 where the short interval was 1 for 2 at 25-30
        # minutes.
        #
        # The accounting that exposed the fault is what closes it. The
        # failure signature was `pd_prefill_requests_total` (24) below
        # `policy_decisions_total` (32) — eight requests decided upon and
        # never dispatched, because the worker had been ejected. Now every
        # one of the seven matches: policy decisions 7, prefill 7, decode 7.
        # 🔴 Was "2", raised to upstream's own default after a live failure
        # (2026-08-28, SGLang 1P1D). Under GPU contention a handful of
        # requests timed out; at threshold 2 that opened the prefill circuit,
        # and it never closed again — every later request was fast-failed in
        # ~0.17s with `No available prefill workers (all circuits open or
        # unhealthy)`, while the router's own `smg_worker_health` for that
        # worker stayed at 1 and the engine answered `/health` 200 the whole
        # time. Still 503 after 90 seconds of silence, well past the 60s
        # half-open timer.
        #
        # The group was down and *nothing else in the product said so*: all
        # three instances RUNNING, the model `state: running`. The only signal
        # was the PD-effectiveness ratio going `suspect`, which is the check
        # working, but the cause was our own setting.
        #
        # ⚠️ The deeper problem this does not fix: with a single replica per
        # role there is no worker to fail over to, so an open circuit is never
        # failover — it converts "slow" into "dead". Upstream has
        # `--disable-circuit-breaker`; whether to use it per-role is
        # open-questions F20.
        - --cb-failure-threshold
        - "10"
        - --retry-max-retries
        - "3"
      peers:
        style: repeated_flag
        prefill: { flag: "--prefill", value: "http://{{peer.ip}}:{{peer.port}}" }
        decode: { flag: "--decode", value: "http://{{peer.ip}}:{{peer.port}}" }
      capabilities:
        metrics: true
        models_endpoint: true
        # vllm_router_pd_prefill_requests_total / pd_decode_requests_total
        # are per-worker, which is the shape the PD-effectiveness ratio
        # needs; the engine side exports the KV-expiry counter.
        kv_expired_metric: true
      # 🆕 Capability 7. Scale-out without restarting the router — and the
      # reason it is worth a schema at all is that this router is a single
      # replica and the gateway's only upstream, so re-rendering peers and
      # restarting it takes the whole group offline for the restart. Every
      # ratio change would cost one outage.
      #
      # 🟢 MEASURED 2026-08-28 on a live 1P1D, replacing "read from upstream
      # source, not measured" (open-questions F12). All four checks passed:
      #
      #   without --enable-igw  POST /workers -> 400 "PD router requires
      #                         specific add_prefill_server or
      #                         add_decode_server methods"   (the source
      #                         reading was right: worker_type is dropped
      #                         before the PD router sees it)
      #   with    --enable-igw  POST /workers -> 200, worker_type dispatched,
      #                         GET /workers shows prefill=1 decode=1
      #   traffic               a real two-hop /v1/chat/completions through the
      #                         dynamically-added pair -> 200
      #   removal               DELETE /workers/{url} -> 200, the member leaves
      #                         the registry
      #   metric names          vllm_router_pd_{prefill,decode}_requests_total
      #                         and pd_requests_total UNCHANGED under igw, with
      #                         the same `worker` label -- so the effectiveness
      #                         ratio's denominator survives the flag
      #
      # 🔴 **The flag is NOT backward compatible, and this is the finding that
      # matters most.** Under igw the peers passed on the COMMAND LINE never
      # enter the registry ("Router ready | workers: []"), and a request then
      # gets 503 "No available workers (all circuits open or unhealthy)".
      # Measured directly: same flags, same running 1P1D, no API call -> 503;
      # after two POST /workers -> 200 and a real two-hop completion.
      #
      # So membership stops being an optimisation and becomes the ONLY way in.
      # Turning the flag on without a consumer that registers every member at
      # group formation does not lose "scale without restart" — it loses the
      # group. That is why `requires_args` names the flag while the recipe's
      # `command` deliberately does not carry it: the declaration records what
      # upstream needs, and flipping it is a change to the group's startup
      # contract, not a config tweak.
      membership_api:
        add: POST /workers
        remove: DELETE /workers/{url}
        # The field that makes the difference between "the request was
        # accepted" and "the member is in the registry": upstream polls the
        # peer before admitting it and drops it silently on timeout, with a
        # default window tuned for small models. Without a read-back a
        # scale-out that quietly failed is indistinguishable from one that
        # worked.
        probe: GET /workers
        body:
          url: "http://{{peer.ip}}:{{peer.port}}"
          model_id: "{{model_name}}"
        role_field: worker_type
        role_values:
          prefill: prefill
          decode: decode
        requires_args:
          - --enable-igw
      health_path: /health

  - name: sglang-mooncake
    display_name: SGLang + Mooncake
    source: built_in
    description: >-
      SGLang's own disaggregation over the Mooncake transfer backend (its
      default), fronted by the official sglang_router. Decode fetches
      prefill's parallelism from prefill's bootstrap service, so the two
      sides rendezvous themselves and the router only has to dispatch.
    backends: [SGLang]
    kv_lease: sglang-mooncake
    roles:
      prefill:
        ports:
          # The engine default (8998) is fixed, so two prefills on one host
          # collide — and it is the same number vLLM's Mooncake connector
          # uses for its bootstrap, so a mixed host collides too. The
          # router is the only consumer of this band, which is why it is
          # safe to read across roles: the router waits for its
          # dependencies, by which time the band is persisted.
          - { name: bootstrap, count: 1, inject_to: args }
        args:
          - --disaggregation-mode
          - prefill
          - --disaggregation-bootstrap-port
          - "{{ports.bootstrap}}"
          - --disaggregation-transfer-backend
          - mooncake
      decode:
        args:
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - mooncake
    router:
      protocol: same_dispatch
      image: "{{runner_image}}"
      ports:
        # Measured: without --prometheus-port the router still binds, on the
        # hardcoded 29000 — `sglang::router` was found listening on
        # 0.0.0.0:29000 while its own port served /metrics as 404. So a second
        # PD group's router on the same host collides, and anything scraping
        # the router's serving port finds nothing. Same defect the vLLM recipe
        # already fixed, never applied here because this path had never run.
        - { name: prometheus, count: 1, inject_to: args }
      command:
        - python3
        - -m
        - sglang_router.launch_router
        - --pd-disaggregation
        - --host
        - "{{worker_ip}}"
        - --port
        - "{{port}}"
        # A bind address, not just an advertised one: left unset the exposition
        # is reachable only from the router's own netns, which puts the
        # PD-effectiveness denominator out of reach of the server.
        - --prometheus-host
        - "{{worker_ip}}"
        - --prometheus-port
        - "{{ports.prometheus}}"
        # Stated rather than changed, on the prefill side. This gateway also
        # defaults to cache_aware, so writing it here alters nothing and
        # removes a silent divergence: the vLLM recipe used to override the
        # default and this one did not, so the two engines routed differently
        # for no recorded reason. Decode moves off the default for the reason
        # given there — prompt KV reaches a decode role over the connector,
        # not out of its own prefix cache.
        #
        # This gateway's policy set is the vLLM fork's minus consistent_hash
        # and rendezvous_hash, plus `manual` (explicit routing keys). Both
        # policies named here exist on both.
        - --prefill-policy
        - cache_aware
        - --decode-policy
        - round_robin
        # The same two values as the vLLM recipe, and for the same reason.
        # `vllm-project/router` is a fork of this gateway, so its defaults
        # are this one's verbatim — `cb_failure_threshold = 10`,
        # `retry_max_retries = 5`, `health_check_interval_secs = 60`. A
        # breaker that needs ten failures to open is ten users' requests
        # spent learning what two would have taught it, and that is as true
        # here as there. See the vllm-nixl recipe for why the health check
        # is deliberately left alone.
        # 🔴 Was "2", raised to upstream's own default after a live failure
        # (2026-08-28, SGLang 1P1D). Under GPU contention a handful of
        # requests timed out; at threshold 2 that opened the prefill circuit,
        # and it never closed again — every later request was fast-failed in
        # ~0.17s with `No available prefill workers (all circuits open or
        # unhealthy)`, while the router's own `smg_worker_health` for that
        # worker stayed at 1 and the engine answered `/health` 200 the whole
        # time. Still 503 after 90 seconds of silence, well past the 60s
        # half-open timer.
        #
        # The group was down and *nothing else in the product said so*: all
        # three instances RUNNING, the model `state: running`. The only signal
        # was the PD-effectiveness ratio going `suspect`, which is the check
        # working, but the cause was our own setting.
        #
        # ⚠️ The deeper problem this does not fix: with a single replica per
        # role there is no worker to fail over to, so an open circuit is never
        # failover — it converts "slow" into "dead". Upstream has
        # `--disable-circuit-breaker`; whether to use it per-role is
        # open-questions F20.
        - --cb-failure-threshold
        - "10"
        - --retry-max-retries
        - "3"
      peers:
        style: repeated_flag
        # A prefill peer is "URL BOOTSTRAP_PORT": the second positional
        # value is the named band above.
        # `peer.ports.` and not `ports.`: in the deployment scope that name
        # means the *router's* band, and for a two-prefill group there is no
        # single right answer there at all — each prefill was allocated its own.
        prefill: { flag: "--prefill", value: "http://{{peer.ip}}:{{peer.port}} {{peer.ports.bootstrap}}" }
        decode: { flag: "--decode", value: "http://{{peer.ip}}:{{peer.port}}" }
      capabilities:
        metrics: true
        models_endpoint: true
        # SGLang's Mooncake path exports no KV-expiry counter.
        kv_expired_metric: false
      # 🆕 Capability 7, deliberately left undeclared. `sglang_router` is the
      # fork this catalog's vLLM router descends from and it does serve
      # `/add_worker` / `/remove_worker` / `/list_workers` — but whether those
      # routes work under `--pd-disaggregation`, and which of the two shapes
      # the body takes, was never read on this side. Declaring the vLLM shape
      # here on the strength of the shared ancestry is the same mistake the
      # metric names above avoided: it would look supported and fail at the
      # first scale-out. Absent means "re-render and restart", which is
      # correct and merely costs an outage.
      # membership_api: {}
      health_path: /health

  - name: sglang-nixl
    display_name: SGLang + NIXL
    source: built_in
    description: >-
      SGLang's disaggregation over the NIXL transfer backend, fronted by the
      same official sglang_router. Unlike vLLM's NixlConnector this path has
      no prefill-side reclaim timeout, so a request cancelled between the
      two sides strands its KV until the instance restarts.
    backends: [SGLang]
    kv_lease: sglang-nixl
    roles:
      prefill:
        ports:
          - { name: bootstrap, count: 1, inject_to: args }
        args:
          - --disaggregation-mode
          - prefill
          - --disaggregation-bootstrap-port
          - "{{ports.bootstrap}}"
          - --disaggregation-transfer-backend
          - nixl
        env:
          # SGLang selects the NIXL plugin by env; UCX is the one the
          # runner images carry.
          SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
          # Same UCX library, same failure as the vLLM NIXL path: left to
          # itself it advertises peer-unroutable virtual-bridge addresses.
          # Inherited from that path rather than measured here.
          UCX_NET_DEVICES: "{{net_device}}"
      decode:
        args:
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - nixl
        env:
          SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
          UCX_NET_DEVICES: "{{net_device}}"
    router:
      protocol: same_dispatch
      image: "{{runner_image}}"
      ports:
        # Measured: without --prometheus-port the router still binds, on the
        # hardcoded 29000 — `sglang::router` was found listening on
        # 0.0.0.0:29000 while its own port served /metrics as 404. So a second
        # PD group's router on the same host collides, and anything scraping
        # the router's serving port finds nothing. Same defect the vLLM recipe
        # already fixed, never applied here because this path had never run.
        - { name: prometheus, count: 1, inject_to: args }
      command:
        - python3
        - -m
        - sglang_router.launch_router
        - --pd-disaggregation
        - --host
        - "{{worker_ip}}"
        - --port
        - "{{port}}"
        # A bind address, not just an advertised one: left unset the exposition
        # is reachable only from the router's own netns, which puts the
        # PD-effectiveness denominator out of reach of the server.
        - --prometheus-host
        - "{{worker_ip}}"
        - --prometheus-port
        - "{{ports.prometheus}}"
        # Stated rather than changed, on the prefill side. This gateway also
        # defaults to cache_aware, so writing it here alters nothing and
        # removes a silent divergence: the vLLM recipe used to override the
        # default and this one did not, so the two engines routed differently
        # for no recorded reason. Decode moves off the default for the reason
        # given there — prompt KV reaches a decode role over the connector,
        # not out of its own prefix cache.
        #
        # This gateway's policy set is the vLLM fork's minus consistent_hash
        # and rendezvous_hash, plus `manual` (explicit routing keys). Both
        # policies named here exist on both.
        - --prefill-policy
        - cache_aware
        - --decode-policy
        - round_robin
        # The same two values as the vLLM recipe, and for the same reason.
        # `vllm-project/router` is a fork of this gateway, so its defaults
        # are this one's verbatim — `cb_failure_threshold = 10`,
        # `retry_max_retries = 5`, `health_check_interval_secs = 60`. A
        # breaker that needs ten failures to open is ten users' requests
        # spent learning what two would have taught it, and that is as true
        # here as there. See the vllm-nixl recipe for why the health check
        # is deliberately left alone.
        # 🔴 Was "2", raised to upstream's own default after a live failure
        # (2026-08-28, SGLang 1P1D). Under GPU contention a handful of
        # requests timed out; at threshold 2 that opened the prefill circuit,
        # and it never closed again — every later request was fast-failed in
        # ~0.17s with `No available prefill workers (all circuits open or
        # unhealthy)`, while the router's own `smg_worker_health` for that
        # worker stayed at 1 and the engine answered `/health` 200 the whole
        # time. Still 503 after 90 seconds of silence, well past the 60s
        # half-open timer.
        #
        # The group was down and *nothing else in the product said so*: all
        # three instances RUNNING, the model `state: running`. The only signal
        # was the PD-effectiveness ratio going `suspect`, which is the check
        # working, but the cause was our own setting.
        #
        # ⚠️ The deeper problem this does not fix: with a single replica per
        # role there is no worker to fail over to, so an open circuit is never
        # failover — it converts "slow" into "dead". Upstream has
        # `--disable-circuit-breaker`; whether to use it per-role is
        # open-questions F20.
        - --cb-failure-threshold
        - "10"
        - --retry-max-retries
        - "3"
      peers:
        style: repeated_flag
        # `peer.ports.` and not `ports.`: in the deployment scope that name
        # means the *router's* band, and for a two-prefill group there is no
        # single right answer there at all — each prefill was allocated its own.
        prefill: { flag: "--prefill", value: "http://{{peer.ip}}:{{peer.port}} {{peer.ports.bootstrap}}" }
        decode: { flag: "--decode", value: "http://{{peer.ip}}:{{peer.port}}" }
      capabilities:
        metrics: true
        models_endpoint: true
        kv_expired_metric: false
      # 🆕 Capability 7, deliberately left undeclared. `sglang_router` is the
      # fork this catalog's vLLM router descends from and it does serve
      # `/add_worker` / `/remove_worker` / `/list_workers` — but whether those
      # routes work under `--pd-disaggregation`, and which of the two shapes
      # the body takes, was never read on this side. Declaring the vLLM shape
      # here on the strength of the shared ancestry is the same mistake the
      # metric names above avoided: it would look supported and fail at the
      # first scale-out. Absent means "re-render and restart", which is
      # correct and merely costs an outage.
      # membership_api: {}
      health_path: /health

  - name: vllm-ascend-mooncake
    display_name: vLLM-Ascend + Mooncake
    source: built_in
    description: >-
      vLLM-Ascend's MooncakeHybridConnector with the transfer engine on the
      Ascend protocol, fronted by vllm-ascend's own proxy example. Reverse
      engineered from a running cross-host 1P1D on 910B2 x8 x2
      (vllm-ascend v0.23.0 / vLLM 0.23.0). Every one of the four
      declarations below differs from the NIXL path, which is why they are
      declarations and not code.
    backends: [vLLM]
    # CANN plus the Ascend docker runtime.
    runtime: ascend
    kv_lease: mooncake
    roles:
      prefill:
        ports:
          # kv_port is a base address and the connector binds one port per
          # worker rank, so the band is as wide as the member's card count:
          #
          #   handshake_port = kv_port
          #                  + data_parallel_rank * tp_size * pp_size
          #                  + (pp_rank + pcp_rank) * tp_size + tp_rank
          #
          # Measured: TP8/DP1 held 41100-41107, and DP2xTP2 held 20001-20004
          # (rank 0 -> base+0, rank 1 -> base+2). The width is the connector's
          # rule, declared here rather than derived in code, and it has no
          # engine default at all — it must be given explicitly.
          #
          # 🔴 The dp term only counts under MoE. vllm/v1/engine/core.py sends
          # non-MoE data-parallel ranks down a "completely independent, so
          # treat like DP=1" branch that zeroes data_parallel_rank, so every
          # rank computes the same base and the second one to bind fails with
          # `Address already in use` — on vllm-ascend v0.23.0 without exiting,
          # leaving the instance wedged in `starting`. Admission refuses that
          # combination rather than letting the band absorb it.
          - { name: kv_port, count: "{{accelerator_count}}", inject_to: args }
        connector:
          kv_connector: MooncakeHybridConnector
          kv_role: kv_producer
          # The port lives inside the connector config, so allocation and
          # connector assembly have to happen at the same moment — the
          # "--kv-transfer-config carries no addresses" property holds for
          # NIXL only.
          kv_port: "{{ports.kv_port}}"
          kv_connector_extra_config:
            # Both sides carry both sides' parallelism: prefill's config
            # names decode's TP and vice versa. Measured as
            # {"prefill":{"dp_size":1,"tp_size":8},"decode":{...}} on both
            # instances. This coupling has no NIXL equivalent and is the
            # reason templates support cross-role references.
            prefill:
              tp_size: "{{roles.prefill.tensor_parallel_size}}"
              dp_size: "{{roles.prefill.data_parallel_size}}"
            decode:
              tp_size: "{{roles.decode.tensor_parallel_size}}"
              dp_size: "{{roles.decode.data_parallel_size}}"
        env:
          # All control plane. The data plane needs nothing from us: CANN
          # uses the per-card RoCE ports directly, and measurement put
          # 99.94% of the bytes there, invisible to the host stack.
          HCCL_IF_IP: "{{worker_ip}}"
          # The worker's NIC, not a per-card one. The card-internal
          # eth0-eth7 names do not exist in the host netns, and the
          # per-card RoCE addresses are unroutable from the host TCP stack,
          # so a handshake address can only ever be the management IP.
          HCCL_SOCKET_IFNAME: "{{net_device}}"
          GLOO_SOCKET_IFNAME: "{{net_device}}"
          TP_SOCKET_IFNAME: "{{net_device}}"
      decode:
        ports:
          # Same rule as prefill's: one port per worker rank, so the band is
          # the member's card count.
          - { name: kv_port, count: "{{accelerator_count}}", inject_to: args }
        connector:
          kv_connector: MooncakeHybridConnector
          kv_role: kv_consumer
          kv_port: "{{ports.kv_port}}"
          kv_connector_extra_config:
            prefill:
              tp_size: "{{roles.prefill.tensor_parallel_size}}"
              dp_size: "{{roles.prefill.data_parallel_size}}"
            decode:
              tp_size: "{{roles.decode.tensor_parallel_size}}"
              dp_size: "{{roles.decode.data_parallel_size}}"
        env:
          HCCL_IF_IP: "{{worker_ip}}"
          HCCL_SOCKET_IFNAME: "{{net_device}}"
          GLOO_SOCKET_IFNAME: "{{net_device}}"
          TP_SOCKET_IFNAME: "{{net_device}}"
    router:
      protocol: two_hop
      image: "{{runner_image}}"
      command:
        - vllm-router
        - --vllm-pd-disaggregation
        # 🔴 `nixl`, on a mode whose transport backend is Mooncake, and that is
        # not a mistake: this flag names the *wire protocol shape*, not the
        # transport. vllm-ascend's Mooncake connector speaks vLLM's
        # NixlConnector protocol — the same six-field
        # `{do_remote_decode, do_remote_prefill, remote_engine_id,
        # remote_block_ids, remote_host, remote_port}` that this router's Nixl
        # branch sends, byte for byte.
        #
        # Choosing `mooncake` here instead is not a degraded pairing, it is a
        # hang: that branch sends a `transfer_id` and first queries a Mooncake
        # bootstrap server on :8998, which vllm-ascend does not run. Measured
        # on 910B2 — the router retried the query 30 times at 10s intervals
        # and no request ever completed.
        - --kv-connector
        - nixl
        - --host
        - "{{worker_ip}}"
        - --port
        - "{{port}}"
        - --prometheus-host
        - "{{worker_ip}}"
        - --prometheus-port
        - "{{ports.prometheus}}"
        # The same two values as the vLLM recipe, and for the same reason: an
        # engine that needs ten failed requests to be taken out of rotation
        # costs ten users what two would have taught it. Everything else is
        # left to the router's own defaults, the health check above all — see
        # the vllm-nixl recipe for why.
        # 🔴 Was "2", raised to upstream's own default after a live failure
        # (2026-08-28, SGLang 1P1D). Under GPU contention a handful of
        # requests timed out; at threshold 2 that opened the prefill circuit,
        # and it never closed again — every later request was fast-failed in
        # ~0.17s with `No available prefill workers (all circuits open or
        # unhealthy)`, while the router's own `smg_worker_health` for that
        # worker stayed at 1 and the engine answered `/health` 200 the whole
        # time. Still 503 after 90 seconds of silence, well past the 60s
        # half-open timer.
        #
        # The group was down and *nothing else in the product said so*: all
        # three instances RUNNING, the model `state: running`. The only signal
        # was the PD-effectiveness ratio going `suspect`, which is the check
        # working, but the cause was our own setting.
        #
        # ⚠️ The deeper problem this does not fix: with a single replica per
        # role there is no worker to fail over to, so an open circuit is never
        # failover — it converts "slow" into "dead". Upstream has
        # `--disable-circuit-breaker`; whether to use it per-role is
        # open-questions F20.
        - --cb-failure-threshold
        - "10"
        - --retry-max-retries
        - "3"
      ports:
        # --prometheus-port defaults to 29000 and always binds, so a second PD
        # group's router on the same host dies in a Rust panic on the
        # collision. Same flag, same band, same reason as the vLLM recipe.
        - { name: prometheus, count: 1, inject_to: args }
      peers:
        style: repeated_flag
        prefill: { flag: "--prefill", value: "http://{{peer.ip}}:{{peer.port}}" }
        decode: { flag: "--decode", value: "http://{{peer.ip}}:{{peer.port}}" }
      capabilities:
        # The first two flip from false, which is the whole point of the swap:
        # the example proxy this replaced served neither, so a disaggregated
        # group on Ascend had no way to answer "is PD doing anything at all".
        metrics: true
        models_endpoint: true
        # 🔴 Stays false, and the catalog's own tripwire is what caught the
        # first draft setting it true. This one is a property of the
        # *connector*, not the router: `kv_leases` records that Mooncake
        # exports zero Prometheus counters, so an expired lease is visible
        # only in the engine log. A router with metrics does not conjure an
        # engine-side counter that was never written.
        kv_expired_metric: false
      # 🆕 Capability 7. Scale-out without restarting the router — and the
      # reason it is worth a schema at all is that this router is a single
      # replica and the gateway's only upstream, so re-rendering peers and
      # restarting it takes the whole group offline for the restart. Every
      # ratio change would cost one outage.
      #
      # ⚠️ Read from upstream source, NOT measured (open-questions F12). The
      # single-router path drops `worker_type` before the PD router sees it and
      # then returns a hardcoded "requires specific add_prefill_server or
      # add_decode_server methods"; `--enable-igw` routes the call through the
      # manager that dispatches on that field. That flag is what `requires_args`
      # names, and the recipe's `command` above does NOT carry it yet — so a
      # consumer must read a failed call as "fall back to restart", never as
      # "the group is broken".
      membership_api:
        add: POST /workers
        remove: DELETE /workers/{url}
        # The field that makes the difference between "the request was
        # accepted" and "the member is in the registry": upstream polls the
        # peer before admitting it and drops it silently on timeout, with a
        # default window tuned for small models. Without a read-back a
        # scale-out that quietly failed is indistinguishable from one that
        # worked.
        probe: GET /workers
        body:
          url: "http://{{peer.ip}}:{{peer.port}}"
          model_id: "{{model_name}}"
        role_field: worker_type
        role_values:
          prefill: prefill
          decode: decode
        requires_args:
          - --enable-igw
      health_path: /health

  - name: custom
    display_name: Custom
    source: built_in
    description: >-
      GPUStack injects no connection state at all: connector, ports,
      handshake variables and the router's image and command are the user's
      to write on the roles. Also the only way to mix engines across roles,
      since every other recipe expands into one engine's connector config.
    # Empty means unconstrained, matching PD_MODE_BACKENDS: with nothing
    # injected, any engine mix is the user's own to get right.
    backends: []
    roles: {}
    router:
      protocol: user_provided
    kv_lease: null
