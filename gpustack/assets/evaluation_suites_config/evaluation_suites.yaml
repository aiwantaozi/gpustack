      - future lm-eval task onboarding
    default_enabled: false

  # Compact suite from the supported benchmark families above, excluding long-context
  # and placeholder-only categories.
  - id: core
    name: Core
    description: >
      Compact suite covering the benchmark families we can
      currently confirm in lm-eval, excluding long-context evaluation.
    category: general_language
    tasks:
      - mmlu_pro
      - ceval-valid
      - ifeval
      - leaderboard_gpqa
      - aime
      - mmmlu
      - mmlu_prox_en
      - global_piqa_prompted
    estimated_runtime_level: medium
    recommended_for:
      - routine regression tracking
      - release candidate comparison
      - general-purpose quality checks
    default_enabled: true

  # Full suite from the supported benchmark families above, including long-context
  # but excluding placeholder-only categories.
  - id: full
    name: Full
    description: >
      Full suite built only from benchmark families we can
      currently confirm in lm-eval task listings.
    category: general_language
    tasks:
      - mmlu_pro
      - ceval-valid
      - ifeval
      - longbench2
      - leaderboard_gpqa
      - aime
      - mmmlu
      - mmlu_prox_en
      - global_piqa_prompted
    estimated_runtime_level: long
    recommended_for:
      - formal model comparison
      - broad release-readiness evaluation
      - end-to-end language capability tracking
    default_enabled: true
