items:
  - id: general
    name: General
    description: >
      Recommended default suite for broad model quality checks. Combines
      general knowledge, hard scientific reasoning, and instruction following
      into one easy-to-explain entry point for product users.
    category: general_language
    tasks:
      - mmlu_pro
      - leaderboard_gpqa
      - ifeval
    estimated_runtime_level: medium
    recommended_for:
      - default model comparison
      - release candidate evaluation
      - broad capability checks
    default_enabled: true

  - id: reasoning
    name: Reasoning
    description: >
      Focused hard-reasoning suite using olympiad-style math problems to
      highlight a model's step-by-step problem solving ability.
    category: reasoning
    tasks:
      - aime
    estimated_runtime_level: medium
    recommended_for:
      - hard reasoning comparison
      - math-heavy evaluation
      - differentiating top-tier models
    default_enabled: true

  - id: coding
    name: Coding
    description: >
      Coding suite for baseline code generation quality using a widely adopted
      executable benchmark that is already available in the current lm-eval
      task inventory.
    category: coding
    tasks:
      - humaneval
    estimated_runtime_level: medium
    recommended_for:
      - code generation checks
      - developer-facing model selection
      - lightweight coding regression tests
    default_enabled: true

  - id: long-context
    name: Long Context
    description: >
      Long-context suite for document-level understanding, retrieval, and
      multi-span reasoning. Useful for modern long-window models, but more
      expensive than the default quick checks.
    category: long_context
    tasks:
      - longbench2
    estimated_runtime_level: long
    recommended_for:
      - long document analysis
      - retrieval and synthesis stress testing
      - long-context regression tracking
    default_enabled: true

  - id: multilingual
    name: Multilingual
    description: >
      Multilingual suite for cross-language and Chinese capability tracking,
      using a broad multilingual benchmark together with a commonly used
      Chinese evaluation set.
    category: multilingual
    tasks:
      - mmmlu
      - ceval-valid
    estimated_runtime_level: medium
    recommended_for:
      - multilingual comparison
      - Chinese capability validation
      - localization readiness checks
    default_enabled: true

  - id: quick
    name: Quick
    description: >
      Fast preset for a low-cost first pass. Covers broad general quality,
      instruction following, and baseline coding ability without the heavier
      long-context or hard-science tasks.
    category: preset
    tasks:
      - mmlu_pro
      - ifeval
      - humaneval
    estimated_runtime_level: short
    recommended_for:
      - quick smoke tests
      - default first-run evaluation
      - low-cost model screening
    default_enabled: true
