  # - TAU2-Bench
  # - VITA-Bench
  # - DeepPlanning
  # - Tool Decathlon
  # - MCP-Mark
  - id: general-agent
    name: General Agent
    description: >
      General agent suite placeholder. The benchmark families from this category
      are not currently confirmed in the local lm-eval task inventory.
    category: agent
    tasks: []
    estimated_runtime_level: long
    recommended_for:
      - agent benchmark coverage planning
      - future lm-eval task onboarding
    default_enabled: false

  # Table category: Search Agent
  # Missing from current lm-eval task inventory:
