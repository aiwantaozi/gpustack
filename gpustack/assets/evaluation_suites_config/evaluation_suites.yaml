items:
  # Hugging Face category: Knowledge
  # Missing from current lm-eval task inventory:
  # - MMLU-Redux
  - id: knowledge
    name: Knowledge
    description: >
      Knowledge suite built from benchmark families with confirmed
      lm-eval support. Covers MMLU-Pro and C-Eval style evaluation.
    category: knowledge
    tasks:
      - mmlu_pro
      - mmlu_redux
      - ceval-valid
      - gpqa
    estimated_runtime_level: medium
    recommended_for:
      - knowledge-heavy regression checks
      - broad academic benchmark comparison
      - Chinese and English factual capability tracking
    default_enabled: true

  # Hugging Face category: Instruction Following
  # Missing from current lm-eval task inventory:
  # - IFBench
  # - MultiChallenge
  - id: instruction-following
    name: Instruction Following
    description: >
      Instruction-following suite built from benchmark families with
      confirmed lm-eval support. Currently covers IFEval.
    category: instruction_following
    tasks:
      - ifeval
    estimated_runtime_level: short
    recommended_for:
      - assistant behavior checks
      - prompt-format compliance validation
      - quick post-deployment verification
    default_enabled: true

  # Hugging Face category: Long Context
  # Missing from current lm-eval task inventory:
  # - AA-LCR
  - id: long-context
    name: Long Context
    description: >
      Long-context suite built from benchmark families with confirmed lm-eval
      support. Currently covers LongBench v2.
    category: long_context
    tasks:
      - longbench2
    estimated_runtime_level: long
    recommended_for:
      - long-context capability checks
      - retrieval and multi-document stress testing
      - long-window regression analysis
    default_enabled: true

  # Hugging Face category: STEM & Reasoning
  # Supported in current lm-eval task inventory:
  # - GPQA -> leaderboard_gpqa
  # Missing from current lm-eval task inventory:
  # - HLE
  # - HLE-Verified
  - id: stem
    name: STEM
    description: >
      STEM suite built from benchmark families with confirmed lm-eval support.
      Currently covers GPQA via the available leaderboard task.
    category: stem
    tasks:
      - leaderboard_gpqa
    estimated_runtime_level: medium
    recommended_for:
      - science and academic reasoning checks
      - benchmark-aligned STEM comparison
    default_enabled: true

  # Table category: Reasoning
  # Missing from current lm-eval task inventory:
  # - LiveCodeBench v6
  # - HMMT Feb 25
  # - HMMT Nov 25
  # - IMOAnswerBench
  # Approximate mappings used here:
  # - AIME26 -> aime
  - id: reasoning
    name: Reasoning
    description: >
      Reasoning suite built from benchmark families with confirmed lm-eval
      support. Currently covers AIME-style evaluation.
    category: reasoning
    tasks:
      - aime
    estimated_runtime_level: medium
    recommended_for:
      - math olympiad style checks
      - hard reasoning comparison
    default_enabled: true

  # Table category: General Agent
  # Missing from current lm-eval task inventory:
